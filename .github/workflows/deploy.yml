name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 凌晨任务：北京时间每天 01:07（UTC 前一天 17:07），避开 GitHub Actions 整点高峰
    #- cron: '7 17 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 午间任务：北京时间每天 11:40（UTC 03:40）
    #- cron: '40 3 * * *'
    # 早上任务：北京时间每天 08:07（UTC 00:07），避开 GitHub Actions 整点高峰
    - cron: '7 0 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    # 以前这里直接用 tee 覆盖 resolv.conf，把 runner 自带的解析器整个丢掉，
    # 只剩 8.8.8.8/8.8.4.4。Google DNS 对 Azure/runner IP 段有速率限制，
    # 一旦被限流就是全盘无法解析（见 run 42942838116：第 4/80 次时
    # weread.qq.com 解析失败）。改为追加，保留 runner 自带解析器在前，
    # Google 仅作兜底，并缩短超时避免单个坏解析器拖慢每次查询。
    - name: Add Google DNS as fallback resolver
      run: |
        cat /etc/resolv.conf
        printf 'nameserver 8.8.8.8\nnameserver 8.8.4.4\noptions timeout:2 attempts:2\n' \
          | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    # 不使用 actions/setup-python：ubuntu-22.04 镜像的 tool cache 已不再预装
    # Python 3.10，setup-python 每次都要从 GitHub release CDN 下载约 30MB，
    # 该 CDN 抖动时会以 504 直接打挂整个 job（见 run 42570423858）。
    # 镜像自带的系统 python3 就是 3.10.x，直接用它，去掉这个网络依赖。
    - name: Install dependencies
      run: |
        python3 -VV
        python3 -m pip install --upgrade pip
        python3 -m pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python3 main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
