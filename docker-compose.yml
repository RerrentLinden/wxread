services:
  wxread:
    # 从本仓库构建，而不是 pull ghcr.io/findmover/wxread:latest。
    # 上游镜像不含本仓库对 main.py 的网络重试修复。
    build: .
    image: wxread-local:latest
    container_name: wxread
    restart: unless-stopped

    # 密钥与配置从 .env 读取（.env 已在 .gitignore 中，不会进版本库）。
    # 首次部署：cp .env.example .env 后填写。
    env_file:
      - .env

    environment:
      TZ: "Asia/Shanghai"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
